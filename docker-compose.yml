services:
  colab-panel:
    build: .
    container_name: colab-panel
    ports: ["8080:8080"]
    environment:
      # MCP 端点 /mcp：1=开启（默认），0/false/no/off=关闭
      MCP_ENABLED: "1"
      # panel_download 在面板侧落盘文件的目录
      MCP_DOWNLOAD_DIR: "/data/mcp-downloads"
      # Host 白名单，逗号分隔；不设则不校验 Host（口令是唯一门槛）
      # MCP_ALLOWED_HOSTS: "colab.example.com"
      # API_TOKEN 可选：不设置（或留空）时自动生成随机口令并落盘复用
      # API_TOKEN: "换成你自己的长随机串"
    volumes:
      # OAuth 凭证 / 会话表 / 面板口令都在这里，必须持久化
      - ${PANEL_DATA_DIR:-./data}:/data
      # EasyColab 服务端源码（随仓库分发在 ./easycolab/app.py）。
      # 换别的副本时把 EASYCOLAB_SRC_DIR 设成宿主机绝对路径。
      - ${EASYCOLAB_SRC_DIR:-./easycolab}:/opt/easycolab:ro
    restart: unless-stopped
